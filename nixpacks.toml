providers = ["php", "node"]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.gd",
  "php82Extensions.zip",
  "php82Extensions.mbstring",
  "php82Extensions.fileinfo",
  "php82Extensions.xml",
  "nodejs_20"
]

[phases.install]
cmds = [
  "composer install --ignore-platform-req=ext-gd --no-dev --optimize-autoloader",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"